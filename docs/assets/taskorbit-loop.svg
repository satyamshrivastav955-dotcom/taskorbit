<svg width="1200" height="430" viewBox="0 0 1200 430" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">TaskOrbit project workflow</title>
  <desc id="desc">An animated orbit connecting brief, assign, execute, review, and deliver.</desc>
  <style>
    .orbit { transform-origin: 600px 215px; animation: spin 24s linear infinite; }
    .orbit-reverse { transform-origin: 600px 215px; animation: spin-reverse 18s linear infinite; }
    .pulse { animation: pulse 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .pulse-delay { animation-delay: 900ms; }
    .dash { stroke-dasharray: 10 14; animation: dash 8s linear infinite; }
    .node-text { font: 700 13px Inter, Arial, sans-serif; letter-spacing: 1.4px; }
    .small-text { font: 500 11px Inter, Arial, sans-serif; letter-spacing: 1.2px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes spin-reverse { to { transform: rotate(-360deg); } }
    @keyframes pulse { 0%, 100% { opacity: .55; transform: scale(1); } 50% { opacity: 1; transform: scale(1.16); } }
    @keyframes dash { to { stroke-dashoffset: -192; } }
    @media (prefers-reduced-motion: reduce) { .orbit, .orbit-reverse, .pulse, .dash { animation: none; } }
  </style>
  <rect width="1200" height="430" rx="24" fill="#0F1A2B"/>
  <path d="M0 350H1200" stroke="#1D2A3D"/>
  <path d="M80 78H1120" stroke="#1D2A3D"/>
  <g opacity=".8">
    <circle cx="600" cy="215" r="147" stroke="#21404D"/>
    <circle cx="600" cy="215" r="103" stroke="#21404D"/>
    <ellipse cx="600" cy="215" rx="252" ry="86" transform="rotate(-16 600 215)" stroke="#28616A" class="dash"/>
  </g>
  <g class="orbit">
    <circle cx="600" cy="68" r="5" fill="#35B9C2" class="pulse"/>
    <circle cx="747" cy="215" r="5" fill="#8290F5" class="pulse pulse-delay"/>
    <circle cx="600" cy="362" r="5" fill="#35B9C2" class="pulse"/>
    <circle cx="453" cy="215" r="5" fill="#8290F5" class="pulse pulse-delay"/>
  </g>
  <g class="orbit-reverse" opacity=".6">
    <circle cx="776" cy="165" r="3.5" fill="#E0A030"/>
    <circle cx="424" cy="265" r="3.5" fill="#73CC80"/>
  </g>
  <circle cx="600" cy="215" r="67" fill="#172A40" stroke="#35B9C2" stroke-width="1.5"/>
  <circle cx="600" cy="215" r="49" stroke="#35B9C2" stroke-opacity=".28"/>
  <path d="M580 218C580 201 590 190 603 190C616 190 624 200 624 216C624 231 615 241 601 241C589 241 580 234 580 218Z" stroke="#35B9C2" stroke-width="2"/>
  <path d="M589 215C595 218 604 218 615 211" stroke="#8290F5" stroke-width="2" stroke-linecap="round"/>
  <circle cx="611" cy="202" r="4" fill="#35B9C2"/>
  <text x="600" y="282" fill="#FFFFFF" text-anchor="middle" class="node-text">TASKORBIT</text>
  <text x="600" y="302" fill="#7F8DA2" text-anchor="middle" class="small-text">ONE SHARED DELIVERY RHYTHM</text>
  <g>
    <rect x="82" y="164" width="160" height="62" rx="9" fill="#172A40" stroke="#2B4354"/>
    <circle cx="108" cy="195" r="13" fill="#E8EFFF"/><path d="M101 195H115M108 188V202" stroke="#4C5BD4" stroke-width="2"/>
    <text x="132" y="192" fill="#FFFFFF" class="node-text">BRIEF</text><text x="132" y="208" fill="#7F8DA2" class="small-text">START CLEAR</text>
  </g>
  <g>
    <rect x="958" y="164" width="160" height="62" rx="9" fill="#172A40" stroke="#2B4354"/>
    <circle cx="984" cy="195" r="13" fill="#DFF4F0"/><path d="M978 195L983 200L991 189" stroke="#0D918C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1008" y="192" fill="#FFFFFF" class="node-text">DELIVER</text><text x="1008" y="208" fill="#7F8DA2" class="small-text">FINISH VISIBLE</text>
  </g>
  <text x="600" y="43" fill="#35B9C2" text-anchor="middle" class="small-text">PROJECT LIFECYCLE MANAGEMENT / CLIENT · MANAGER · ASSIGNEE · REVIEWER</text>
</svg>
